name: GOAL-X AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project archive
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Android proje ZIP dosyasi bulunamadi."
            exit 1
          fi

          echo "Bulunan ZIP: $ZIP_FILE"

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          SETTINGS_FILE=$(find android-project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle veya settings.gradle.kts bulunamadi."
            find android-project -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android proje klasoru: $PROJECT_DIR"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager bulunamadi."
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"

          yes | bash "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true

          bash "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Fix Kotlin JVM compatibility
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f gradle.properties ]; then
            echo "" >> gradle.properties
            echo "kotlin.jvm.target.validation.mode=ignore" >> gradle.properties
          else
            echo "kotlin.jvm.target.validation.mode=ignore" > gradle.properties
          fi

          echo "Gradle properties:"
          cat gradle.properties

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle --version

          gradle --no-daemon --stacktrace assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK olusturulamadi."
            exit 1
          fi

          echo "APK bulundu: $APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/GOAL-X-AI.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GOAL-X-AI-APK
          path: apk-output/GOAL-X-AI.apk
          if-no-files-found: error
