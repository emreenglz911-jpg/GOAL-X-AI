name: GOAL-X AI V2.4 PREMIUM UI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        shell: bash
        run: |
          set -e
          ZIP="./GOALX_AI_V2_4_PREMIUM_UI.zip"
          test -f "$ZIP"

          rm -rf android-project
          mkdir -p android-project
          unzip -q "$ZIP" -d android-project

          SETTINGS=$(find android-project -type f -name "settings.gradle*" -print -quit)
          test -n "$SETTINGS"

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Android SDK
        shell: bash
        run: |
          set -e
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDK="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDK" ]; then
            SDK=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name "sdkmanager" -print -quit)
          fi

          test -n "$SDK"

          yes | bash "$SDK" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true

          bash "$SDK" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Gradle
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          touch gradle.properties
          echo "kotlin.jvm.target.validation.mode=ignore" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -e
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" -print -quit)
          test -n "$APK"

          mkdir -p apk-output
          cp "$APK" apk-output/GOAL-X-AI-V2.4-PREMIUM-UI.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GOAL-X-AI-V2.4-PREMIUM-UI-APK
          path: apk-output/GOAL-X-AI-V2.4-PREMIUM-UI.apk
          if-no-files-found: error
          retention-days: 7
