name: GOAL-X AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android project archive
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "HATA: Android proje ZIP dosyası bulunamadı."
            exit 1
          fi

          echo "Bulunan ZIP: $ZIP"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          echo "ZIP açıldı."

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "HATA: Android proje bulunamadı."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android proje dizini: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "$ANDROID_HOME" ]; then
            echo "HATA: ANDROID_HOME bulunamadı."
            exit 1
          fi

          SDKMANAGER=$(find "$ANDROID_HOME" \
            -type f \
            -name sdkmanager \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "HATA: sdkmanager bulunamadı."
            exit 1
          fi

          echo "sdkmanager bulundu:"
          echo "$SDKMANAGER"

          bash "$SDKMANAGER" --version

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME" \
            -type f \
            -name sdkmanager \
            | head -n 1)

          yes | bash "$SDKMANAGER" --licenses || true

          bash "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # JAVA 1.8 / KOTLIN 17 HATASINI DÜZELT
      - name: Fix JVM target compatibility
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "JVM hedefleri 17 olarak ayarlanıyor..."

          cat > "$RUNNER_TEMP/jvm-fix.gradle" <<'EOF'
          allprojects {
              afterEvaluate { project ->
                  project.tasks.withType(JavaCompile).configureEach {
                      sourceCompatibility = "17"
                      targetCompatibility = "17"
                  }

                  project.tasks.configureEach { task ->
                      if (task.name.toLowerCase().contains("kotlin")) {
                          try {
                              task.kotlinOptions.jvmTarget = "17"
                          } catch (Exception ignored) {
                          }
                      }
                  }
              }
          }
          EOF

          echo "JVM düzeltme dosyası oluşturuldu."

          cat "$RUNNER_TEMP/jvm-fix.gradle"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "GOAL-X AI APK DERLEME BAŞLIYOR"
          echo "======================================"

          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Proje:"
          pwd

          echo ""
          echo "APK derleniyor..."

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --init-script "$RUNNER_TEMP/jvm-fix.gradle"

          echo ""
          echo "APK DERLEME TAMAMLANDI!"

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "${PROJECT_DIR}" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "HATA: APK bulunamadı."
            find "${PROJECT_DIR}" -type f | tail -100
            exit 1
          fi

          echo "======================================"
          echo "APK BULUNDU:"
          echo "$APK"
          echo "======================================"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GOAL-X-AI-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
