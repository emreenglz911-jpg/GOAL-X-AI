name: GOAL-X AI V2.4 PREMIUM UI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract V2.4 Premium UI
        shell: bash
        run: |
          set -e

          ZIP_FILE="./GOALX_AI_V2_4_PREMIUM_UI.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "V2.4 ZIP not found: $ZIP_FILE"
            exit 1
          fi

          rm -rf android-project
          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project

          SETTINGS_FILE=$(find android-project -type f -name "settings.gradle*" -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android settings file not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Configure Android SDK
        shell: bash
       
