name: GOAL-X AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1 - KODU AL
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2 - ANDROID PROJE ZIP DOSYASINI BUL
      # --------------------------------------------------
      - name: Find Android project archive
        shell: bash
        run: |
          set -e

          echo "ZIP dosyaları aranıyor..."

          ZIP=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "HATA: Android proje ZIP dosyası bulunamadı."
            echo "Depodaki dosyalar:"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Bulunan ZIP: $ZIP"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          echo "ZIP başarıyla açıldı."

          find project -maxdepth 4 -type f | head -150


      # --------------------------------------------------
      # 3 - ANDROID PROJE DİZİNİNİ BUL
      # --------------------------------------------------
      - name: Find Android project
        shell: bash
        run: |
          set -e

          echo "Android proje dosyaları aranıyor..."

          SETTINGS=$(find project -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "HATA: settings.gradle veya settings.gradle.kts bulunamadı."
            echo "Proje içeriği:"
            find project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android proje dizini:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 4 - JAVA 17
      # --------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # 5 - ANDROID SDK'YI DOĞRUDAN KULLAN
      # setup-android ACTION KULLANILMIYOR
      # --------------------------------------------------
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME bulunamadı."
            exit 1
          fi

          echo "Android SDK kontrol ediliyor..."

          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "HATA: sdkmanager bulunamadı."
            find "$ANDROID_HOME" -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "sdkmanager bulundu:"
          echo "$SDKMANAGER"

          chmod +x "$SDKMANAGER"

          SDK_DIR=$(dirname "$SDKMANAGER")

          echo "$SDK_DIR" >> "$GITHUB_PATH"

          echo "Android SDK hazır."


      # --------------------------------------------------
      # 6 - ANDROID SDK PAKETLERİ
      # --------------------------------------------------
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)

          echo "SDK Manager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK paketleri hazır."


      # --------------------------------------------------
      # 7 - GRADLE 8.9
      # --------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # --------------------------------------------------
      # 8 - APK DERLE
      # --------------------------------------------------
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "GOAL-X AI APK DERLEME BAŞLIYOR"
          echo "======================================"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Proje dizini:"
          pwd

          echo ""
          echo "Proje dosyaları:"
          ls -la

          echo ""
          echo "APK derleniyor..."

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

          echo ""
          echo "APK DERLEME TAMAMLANDI."


      # --------------------------------------------------
      # 9 - APK'YI BUL
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "APK aranıyor..."

          APK=$(find "${PROJECT_DIR}" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "HATA: APK oluşturulamadı."

            echo ""
            echo "Build klasörleri:"
            find "${PROJECT_DIR}" \
              -type d \
              -name build \
              -print

            echo ""
            echo "Son dosyalar:"
            find "${PROJECT_DIR}" \
              -type f \
              | tail -100

            exit 1
          fi

          echo "======================================"
          echo "APK BULUNDU"
          echo "$APK"
          echo "======================================"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 10 - APK'YI GITHUB'A YÜKLE
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GOAL-X-AI-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
