name: GOAL-X AI V2.1 PRO SIGNAL APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract GOAL-X AI V2.1 PRO SIGNAL
        shell: bash
        run: |
          set -e

          ZIP_FILE="./GOALX_AI_V2_1_PRO_SIGNAL.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "V2.1 ZIP bulunamadi: $ZIP_FILE"
            exit 1
          fi

          rm -rf android-project
          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project

          SETTINGS_FILE=$(find android-project -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android proje dosyalari bulunamadi."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

         
