name: GOAL-X AI V2.2 FREE SIGNAL FIX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract V2.2 project
        shell: bash
        run: |
          set -e

          ZIP_FILE="./GOALX_AI_V2_2_FREE_SIGNAL_FIX.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "V2.2 ZIP not found: $ZIP_FILE"
            exit 1
          fi

          rm -rf android-project
          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project

          SETTINGS_FILE=$(find android-project -type f -name "settings.gradle*" -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android settings file not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name "sdkmanager" -print -quit)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found."
            exit 1
          fi

          yes | bash "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses >/dev/null || true

          bash "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Gradle
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          touch gradle.properties
          echo "" >> gradle.properties
          echo "kotlin.jvm.target.validation.mode=ignore" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Build V2.2 APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          java -version
          gradle --version

          gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "APK not found."
            exit 1
          fi

          echo "APK found: $APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/GOAL-X-AI-V2.2-FREE-SIGNAL-FIX.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GOAL-X-AI-V2.2-FREE-SIGNAL-FIX-APK
          path: apk-output/GOAL-X-AI-V2.2-FREE-SIGNAL-FIX.apk
          if-no-files-found: error
          retention-days: 7
