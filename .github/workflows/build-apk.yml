name: GOAL-X AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Find Android project archive
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "HATA: Android proje ZIP dosyası bulunamadı."
            exit 1
          fi

          echo "Bulunan ZIP: $ZIP"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          echo "ZIP açıldı."


      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project -type f \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "HATA: Android proje bulunamadı."
            find project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android proje dizini: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "$ANDROID_HOME" ]; then
            echo "HATA: ANDROID_HOME bulunamadı."
            exit 1
          fi

          SDKMANAGER=$(find "$ANDROID_HOME" \
            -type f \
            -name sdkmanager \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "HATA: sdkmanager bulunamadı."
            exit 1
          fi

          echo "sdkmanager bulundu:"
          echo "$SDKMANAGER"

          bash "$SDKMANAGER" --version

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"


      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME" \
            -type f \
            -name sdkmanager \
            | head -n 1)

          yes | bash "$SDKMANAGER" --licenses || true

          bash "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK hazır."


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ==================================================
      # PROJENİN JAVA/KOTLIN JVM AYARLARINI DÜZELT
      # ==================================================
      - name: Fix Java Kotlin JVM targets
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "JAVA / KOTLIN JVM AYARLARI DÜZELTİLİYOR"
          echo "======================================"

          python3 <<'PY'
          import pathlib
          import re

          root = pathlib.Path(".")

          files = list(root.rglob("*.gradle")) + list(root.rglob("*.gradle.kts"))

          print("Gradle dosyaları:")

          for f in files:
              print(" -", f)

              text = f.read_text(encoding="utf-8")

              # Java 8 -> Java 17
              text = text.replace(
                  "JavaVersion.VERSION_1_8",
                  "JavaVersion.VERSION_17"
              )

              text = text.replace(
                  "JavaVersion.VERSION_8",
                  "JavaVersion.VERSION_17"
              )

              # Java sourceCompatibility / targetCompatibility
              text = re.sub(
                  r'(sourceCompatibility\s*=\s*)["\']1\.8["\']',
                  r'\g<1>"17"',
                  text
              )

              text = re.sub(
                  r'(targetCompatibility\s*=\s*)["\']1\.8["\']',
                  r'\g<1>"17"',
                  text
              )

              # Kotlin JVM target
              text = re.sub(
                  r'(jvmTarget\s*=\s*)["\']1\.8["\']',
                  r'\g<1>"17"',
                  text
              )

              # Kotlin JVM enum
              text = text.replace(
                  "JvmTarget.JVM_1_8",
                  "JvmTarget.JVM_17"
              )

              # Kotlin compiler option
              text = text.replace(
                  'jvmTarget = "1.8"',
                  'jvmTarget = "17"'
              )

              text = text.replace(
                  "jvmTarget = '1.8'",
                  "jvmTarget = '17'"
              )

              f.write_text(text, encoding="utf-8")

          print("")
          print("JVM ayarları 17 seviyesine getirildi.")
          PY

          echo ""
          echo "Kontrol:"
          grep -RniE \
            "VERSION_1_8|VERSION_8|jvmTarget.*1\.8|JVM_1_8|sourceCompatibility.*1\.8|targetCompatibility.*1\.8" \
            . \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            || true


      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "GOAL-X AI APK DERLEME BAŞLIYOR"
          echo "======================================"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Proje:"
          pwd

          echo ""
          echo "APK derleniyor..."

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "======================================"
          echo "APK DERLEME TAMAMLANDI"
          echo "======================================"


      - name: Find APK
